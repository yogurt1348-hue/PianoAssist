name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset windows-x64-${{ matrix.config == 'Debug' && 'debug' || 'release' }} --parallel
      - name: Test
        run: ctest --preset windows-x64-${{ matrix.config == 'Debug' && 'debug' || 'release' }}
      - name: Check the exe needs no Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $exe = "build/windows-x64/src/app/PianoAssistApp_artefacts/${{ matrix.config }}/PianoAssist.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $exe | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }
          $deps | ForEach-Object { Write-Host "  $_" }
          $runtime = $deps | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt)' }
          if ($runtime) { Write-Error "PianoAssist.exe depends on runtime DLLs: $runtime"; exit 1 }
      - name: Package app
        shell: pwsh
        run: |
          $exe = "build/windows-x64/src/app/PianoAssistApp_artefacts/${{ matrix.config }}/PianoAssist.exe"
          Compress-Archive -Path $exe -DestinationPath "PianoAssist-windows-x64-${{ matrix.config }}.zip"
      - name: Build installer (Release, unsigned)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $exe = Resolve-Path "build/windows-x64/src/app/PianoAssistApp_artefacts/Release/PianoAssist.exe"
          & $iscc /Qp "/DAppVersion=$version" "/DSourceExe=$exe" "/O$PWD" installer/PianoAssist.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem PianoAssist-*-setup.exe | Rename-Item -NewName "PianoAssist-windows-x64-setup.exe"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: PianoAssist-windows-x64-${{ matrix.config }}
          path: PianoAssist-windows-x64-*
          if-no-files-found: error

  test-build-release:
    name: Publish test build (pre-release)
    # Only for pushes to work branches: gives a direct download link for
    # manual testing on Windows. Never marked as a real release.
    if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PianoAssist-windows-x64-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Test build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          body: |
            Automatic test build from `${{ github.ref_name }}` at ${{ github.sha }}.
            Not a release. Either run PianoAssist-windows-x64-setup.exe (per-user install, no admin rights, unsigned so Windows SmartScreen may ask "Run anyway"), or unzip and run PianoAssist.exe. Release is the one to test; Debug is slower and for diagnosis. Nothing else needs installing.
          files: |
            PianoAssist-windows-x64-*.zip
            PianoAssist-windows-x64-setup.exe

  tests-linux:
    name: Domain tests (Linux, no JUCE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset tests-only
      - name: Build
        run: cmake --build --preset tests-only --parallel
      - name: Test
        run: ctest --preset tests-only
