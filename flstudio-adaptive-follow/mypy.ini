# Static check of the FL Studio entry scripts against Image-Line's official
# API stubs (pip package fl-studio-api-stubs). Run: tools/check_fl_api.py
[mypy]
check_untyped_defs = True
warn_unused_ignores = False

# The shared core is plain, untyped Python tested by pytest; only the use of
# FL Studio modules (transport, mixer, general, midi, ui, flpianoroll) is checked here.
[mypy-adaptive_follow.*]
follow_imports = skip

[mypy-adaptive_follow_paths]
ignore_missing_imports = True
