[project]
name = "adaptive-follow"
version = "0.1.3"
description = "Adaptive Follow MVP: FL Studio's transport follows a live performer (MIDI device script + Piano Roll exporter)"
readme = "README.md"
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5", "fl-studio-api-stubs==37.0.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "shared"}
packages = ["adaptive_follow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
